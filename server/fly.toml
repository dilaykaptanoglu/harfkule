# Deploy (Dilay Mac / CI with FLY_API_TOKEN):
#   cd server
#   fly auth login
#   fly apps create harfkule-api   # once; pick a free name if taken
#   fly volumes create harfkule_data --region fra --size 1
#   fly deploy
#   fly apps open                 # note the https://….fly.dev URL
#
# Then set that URL in eas.json → build.preview/production.env.EXPO_PUBLIC_API_URL
# and rebuild: npx eas-cli@latest build -p ios --profile production

app = "harfkule-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "harfkule_data"
  destination = "/data"
